name: observability

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  order-api:
    <<: [*restart, *logging]
    build: ./app
    image: observability/order-api:1.0.0
    environment:
      APP_VERSION: "1.0.0"
      FAILURE_RATE: ${APP_FAILURE_RATE:-0}
    ports:
      - "127.0.0.1:8000:8000"
    networks: [obs]

  node-exporter:
    <<: [*restart, *logging]
    image: prom/node-exporter:v1.9.1
    # host network/pid so it reports the real host
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=${NODE_EXPORTER_LISTEN:-172.30.0.1:9100}
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run/credentials/.+|sys|var/lib/docker/.+|var/snap/.+|snap/.+)($$|/)
    volumes:
      - /:/host:ro,rslave
    depends_on: [prometheus]   # needs the obs bridge to exist

  prometheus:
    <<: [*restart, *logging]
    image: prom/prometheus:v3.4.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [obs]

  loki:
    <<: [*restart, *logging]
    image: grafana/loki:3.5.1
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks: [obs]

  grafana:
    <<: [*restart, *logging]
    image: grafana/grafana:12.0.2
    depends_on: [prometheus, loki]
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?Set GF_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
      # SMTP settings come from .env
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      GF_SMTP_USER: ${SMTP_USER:-}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:?Set SMTP_FROM_ADDRESS in .env}
      GF_SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Grafana Alerts}
      GF_SMTP_STARTTLS_POLICY: ${SMTP_STARTTLS_POLICY:-MandatoryStartTLS}
      GF_SMTP_SKIP_VERIFY: "false"
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:?Set ALERT_EMAIL_TO in .env}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks: [obs]

networks:
  obs:
    name: obs
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
