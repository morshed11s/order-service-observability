global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: ubuntu-laptop

scrape_configs:
  - job_name: node-exporter
    static_configs:
      - targets: ["172.30.0.1:9100"]
        labels:
          role: ubuntu-host
    relabel_configs:
      - target_label: instance
        replacement: ubuntu-laptop

  - job_name: order-api
    metrics_path: /metrics
    static_configs:
      - targets: ["order-api:8000"]
        labels:
          service: order-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
